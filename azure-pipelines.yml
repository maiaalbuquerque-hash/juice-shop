trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: npm install -g snyk
    displayName: 'Install Snyk CLI'

  - script: snyk config environment SNYK-US-02
    displayName: 'Set Snyk region'

  - script: snyk auth $(SNYK_TOKEN)
    displayName: 'Authenticate Snyk'
    env:
      SNYK_TOKEN: $(SNYK_TOKEN)

  - script: snyk code test --org=dad5720b-dd1d-4159-85f7-d7c58fe11563
    displayName: 'Run Snyk Code Test'
    continueOnError: true

  - script: snyk test --severity-threshold=high --org=dad5720b-dd1d-4159-85f7-d7c58fe11563
    displayName: 'Run Snyk Test'
    continueOnError: true